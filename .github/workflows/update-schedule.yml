name: Update schedule

on:
  schedule:
    - cron: '17 4 * * 1'  # Every Monday at 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-schedule.mjs'
      - '.github/workflows/update-schedule.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --omit=optional

      - name: Build schedule.json
        run: node scripts/build-schedule.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- schedule.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "st-allbins-bot"
          git config user.email "st-allbins-bot@users.noreply.github.com"
          git add schedule.json
          git commit -m "chore: refresh schedule.json from council PDFs"
          git push
