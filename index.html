<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>St Allbins</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='56'%3E%F0%9F%97%91%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f6f5f1;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --card: #ffffff;
    --border: rgba(0,0,0,0.08);
    --refuse: #6f4a1f;    /* brown  */
    --recycling: #1f1f1f; /* black  */
    --garden: #3a8a3a;    /* green  */
    --accent: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101010;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --card: #1c1c1c;
      --border: rgba(255,255,255,0.08);
      --accent: #f2f2f2;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px 8px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  h1 .allbins { color: var(--muted); font-weight: 400; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 8px;
    margin: -8px;
    border-radius: 8px;
    font: inherit;
  }
  .icon-btn:hover { color: var(--fg); background: var(--border); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 32px;
    text-align: center;
  }
  .headline {
    font-size: clamp(36px, 10vw, 64px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0;
  }
  .headline small {
    display: block;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .bins {
    display: flex;
    gap: 20px;
    align-items: end;
    justify-content: center;
    flex-wrap: wrap;
  }
  .bin { width: clamp(90px, 24vw, 140px); height: auto; display: block; }
  .footer-note {
    color: var(--muted);
    font-size: 14px;
    max-width: 32ch;
  }
  footer {
    padding: 16px 24px 24px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  footer a { color: inherit; }

  /* Modal */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .backdrop.open { display: flex; }
  .modal {
    background: var(--card);
    color: var(--fg);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    border: 1px solid var(--border);
  }
  .modal h2 { margin: 0 0 4px; font-size: 20px; }
  .modal p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .modal .field { margin-bottom: 20px; }
  .modal label.field-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label {
    text-align: center;
    padding: 10px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .segmented input:checked + label { background: var(--accent); color: var(--card); }
  .modal .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .modal .hint a { color: inherit; }
  .modal .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .btn {
    background: var(--accent);
    color: var(--card);
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.secondary { background: transparent; color: var(--fg); }
</style>
</head>
<body>

<header>
  <h1>St <span class="allbins">Allbins</span></h1>
  <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">⚙︎</button>
</header>

<main id="main" hidden>
  <div>
    <p class="headline"><small id="when">This week</small><span id="what">—</span></p>
  </div>
  <div class="bins" id="bins"></div>
  <p class="footer-note" id="note"></p>
</main>

<footer>
  <span id="generated">—</span> · <a href="https://www.stalbans.gov.uk/rubbish-collections" target="_blank" rel="noopener">council source</a>
</footer>

<div class="backdrop" id="setup">
  <form class="modal" id="setup-form">
    <h2>Set up St Allbins</h2>
    <p>Tell us your collection round. This is stored on your device only.</p>

    <div class="field">
      <label class="field-label">Which collection week are you?</label>
      <div class="segmented">
        <input type="radio" name="week" value="1" id="w1" required />
        <label for="w1">Week 1</label>
        <input type="radio" name="week" value="2" id="w2" />
        <label for="w2">Week 2</label>
      </div>
      <p class="hint">Not sure? <a href="https://www.stalbans.gov.uk/rubbish-collections" target="_blank" rel="noopener">Look up your road on the council site</a>.</p>
    </div>

    <div class="field">
      <label class="field-label">Garden waste subscription?</label>
      <div class="segmented">
        <input type="radio" name="garden" value="no" id="gn" required />
        <label for="gn">No</label>
        <input type="radio" name="garden" value="yes" id="gy" />
        <label for="gy">Yes</label>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn secondary" id="cancel-btn" hidden>Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</div>

<script type="module">
const STORE_KEY = 'st-allbins:prefs:v1';

function loadPrefs() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  // URL params override / seed
  const p = new URLSearchParams(location.search);
  if (p.has('week')) {
    return { week: Number(p.get('week')), garden: p.get('garden') === '1' || p.get('garden') === 'yes' };
  }
  return null;
}
function savePrefs(prefs) { localStorage.setItem(STORE_KEY, JSON.stringify(prefs)); }

function isoToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtRange(startIso) {
  const s = new Date(startIso + 'T00:00:00');
  const e = new Date(s); e.setDate(s.getDate() + 6);
  const opts = { day: 'numeric', month: 'short' };
  return `${s.toLocaleDateString('en-GB', opts)} – ${e.toLocaleDateString('en-GB', opts)}`;
}
function findWeek(schedule, iso) {
  // weeks[i].start is a Monday; look for the entry where start <= iso < start+7
  for (const w of schedule.weeks) {
    if (iso >= w.start && iso < addDays(w.start, 7)) return w;
  }
  return null;
}
function inGardenBreak(iso, gb) {
  return gb && iso >= gb.start && iso <= gb.end;
}

const BIN_LABEL = { refuse: 'Landfill', recycling: 'Recycling', garden: 'Garden waste' };
function binSvg(kind) {
  // Simple wheelie bin. Colours applied via CSS var.
  const color = kind === 'refuse' ? 'var(--refuse)' : kind === 'garden' ? 'var(--garden)' : 'var(--recycling)';
  return `
  <svg class="bin" viewBox="0 0 120 160" role="img" aria-label="${BIN_LABEL[kind]} bin" xmlns="http://www.w3.org/2000/svg">
    <!-- lid -->
    <rect x="10" y="18" width="100" height="14" rx="4" fill="${color}"/>
    <rect x="52" y="8" width="16" height="14" rx="3" fill="${color}"/>
    <!-- body -->
    <path d="M20 34 L100 34 L94 148 Q94 152 90 152 L30 152 Q26 152 26 148 Z" fill="${color}"/>
    <!-- ribs -->
    <line x1="30" y1="60" x2="90" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <line x1="30" y1="90" x2="90" y2="90" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <line x1="30" y1="120" x2="90" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- wheels -->
    <circle cx="34" cy="154" r="6" fill="#111"/>
    <circle cx="86" cy="154" r="6" fill="#111"/>
  </svg>`;
}

function render(schedule, prefs) {
  const today = isoToday();
  const week = findWeek(schedule, today);
  const main = document.getElementById('main');
  const whatEl = document.getElementById('what');
  const whenEl = document.getElementById('when');
  const binsEl = document.getElementById('bins');
  const noteEl = document.getElementById('note');

  main.hidden = false;

  if (!week) {
    whenEl.textContent = 'Schedule';
    whatEl.textContent = 'Out of date';
    binsEl.innerHTML = '';
    noteEl.innerHTML = `The council schedule ends ${schedule.weeks.at(-1)?.start}. This app auto-updates weekly — try again soon.`;
    return;
  }

  const type = prefs.week === 1 ? week.week1 : week.week2;
  const bins = [];
  if (type === 'refuse') bins.push('refuse');
  else if (type === 'recycling') {
    bins.push('recycling');
    if (prefs.garden && !inGardenBreak(today, schedule.gardenBreak)) bins.push('garden');
  }

  whenEl.textContent = `Week of ${fmtRange(week.start)}`;
  whatEl.textContent = bins.map(b => BIN_LABEL[b]).join(' + ') || 'Nothing scheduled';
  binsEl.innerHTML = bins.map(binSvg).join('');

  const notes = [];
  if (prefs.garden && type === 'recycling' && inGardenBreak(today, schedule.gardenBreak)) {
    notes.push('Garden waste paused for the festive break — resumes 11 Jan.');
  }
  noteEl.textContent = notes.join(' ');
}

function openSetup(prefs) {
  const setup = document.getElementById('setup');
  const cancel = document.getElementById('cancel-btn');
  cancel.hidden = !prefs;
  if (prefs) {
    document.getElementById(`w${prefs.week}`).checked = true;
    document.getElementById(prefs.garden ? 'gy' : 'gn').checked = true;
  }
  setup.classList.add('open');
}
function closeSetup() { document.getElementById('setup').classList.remove('open'); }

async function boot() {
  let schedule;
  try {
    const res = await fetch('schedule.json', { cache: 'no-cache' });
    schedule = await res.json();
  } catch (e) {
    document.getElementById('main').hidden = false;
    document.getElementById('what').textContent = 'Can’t load schedule';
    return;
  }
  document.getElementById('generated').textContent = `Updated ${new Date(schedule.generated).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`;

  let prefs = loadPrefs();
  if (prefs) render(schedule, prefs);
  else openSetup(null);

  document.getElementById('setup-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const next = { week: Number(fd.get('week')), garden: fd.get('garden') === 'yes' };
    savePrefs(next);
    prefs = next;
    closeSetup();
    render(schedule, prefs);
  });
  document.getElementById('cancel-btn').addEventListener('click', closeSetup);
  document.getElementById('settings-btn').addEventListener('click', () => openSetup(prefs));
}
boot();
</script>
</body>
</html>
